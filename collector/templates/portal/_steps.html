<ol class="steps" aria-label="E-Center progress">

  <!-- STEP 1 -->
  <li class="
    {% if step == 1 %}active
    {% elif step > 1 %}done
    {% endif %}
  ">
    {% if step > 1 and not has_transaction %}
      <a href="{% url 'services' %}">
        <span>1</span>
        Choose service
      </a>
    {% else %}
      <span>1</span>
      Choose service
    {% endif %}
  </li>


  <!-- STEP 2 -->
  <li class="
    {% if step == 2 %}active
    {% elif step > 2 %}done
    {% endif %}
  ">
    <span>2</span>
    View requirements
  </li>


  <!-- STEP 3 -->
  <li class="
    {% if not has_transaction %}disabled
    {% elif step == 3 %}active
    {% elif step > 3 %}done
    {% endif %}
  ">
    <span>3</span>
    Transaction status
  </li>


  <!-- STEP 4 -->
  <li class="
    {% if not has_transaction %}disabled
    {% elif step == 4 %}active
    {% endif %}
  ">
    <span>4</span>
    Tracking QR
  </li>

</ol>

<style>
/* =========================================================
   PROGRESS STEPS
   ========================================================= */

.steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3rem;

    width: 100%;
    margin: 0 auto 2rem;
    padding: 0;

    list-style: none;
}

.steps li {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    white-space: nowrap;
}

.steps li span {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 36px;
    height: 36px;
    flex-shrink: 0;

    border-radius: 50%;
}

.steps li a {
    display: flex;
    align-items: center;
    gap: 0.6rem;

    color: inherit;
    text-decoration: none;
}

/* Steps 3 & 4 before a valid transaction exists */
.steps li.disabled {
    opacity: 0.35;
    cursor: default;
    pointer-events: none;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 768px) {

    .steps {
        position: sticky;

        /* CHANGE THIS to the actual height of your navbar */
        top: 64px;

        z-index: 900;

        width: 100%;

        margin: 0 0 1.5rem;
        padding: 0.7rem 0.75rem;

        box-sizing: border-box;

        gap: 0;

        background: var(--background, #ffffff);

        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .steps li {
        flex: 1;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;

        gap: 0.3rem;

        min-width: 0;

        font-size: 0.68rem;
        line-height: 1.2;
        text-align: center;
        white-space: normal;
    }

    .steps li span {
        width: 30px;
        height: 30px;

        font-size: 0.75rem;
        font-weight: 700;
    }

    .steps li a {
        display: flex;
        flex-direction: column;
        align-items: center;

        gap: 0.3rem;

        text-align: center;
    }
}
</style>
