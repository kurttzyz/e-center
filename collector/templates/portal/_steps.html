<ol class="steps" aria-label="E-Center progress">

  <!-- STEP 1 -->
  <li class="
    {% if step == 1 %}active
    {% elif step > 1 %}done
    {% endif %}
  ">
    {% if step > 1 and not has_transaction %}
      <a href="{% url 'services' %}">
        <span>1</span>
        Choose service
      </a>
    {% else %}
      <span>1</span>
      Choose service
    {% endif %}
  </li>


  <!-- STEP 2 -->
  <li class="
    {% if step == 2 %}active
    {% elif step > 2 %}done
    {% endif %}
  ">
    <span>2</span>
    View requirements
  </li>


  <!-- STEP 3 -->
  <li class="
    {% if not has_transaction %}disabled
    {% elif step == 3 %}active
    {% elif step > 3 %}done
    {% endif %}
  ">
    <span>3</span>
    Transaction status
  </li>


  <!-- STEP 4 -->
  <li class="
    {% if not has_transaction %}disabled
    {% elif step == 4 %}active
    {% endif %}
  ">
    <span>4</span>
    Tracking QR
  </li>

</ol>

<style>
  .steps {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3rem;

    width: 100%;
    margin: 0 auto 2rem;
    padding: 0;

    list-style: none;
}

.steps li {
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.steps li span {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 36px;
    height: 36px;
    flex-shrink: 0;

    border-radius: 50%;
}

/* Steps that cannot be accessed yet */
.steps li.disabled {
    opacity: 0.35;
    cursor: default;
    pointer-events: none;
}

/* Mobile */
@media (max-width: 768px) {
    .steps {
        gap: 1rem;
        flex-wrap: wrap;
    }

    .steps li {
        font-size: 0.85rem;
    }

    .steps li span {
        width: 32px;
        height: 32px;
    }
}
</style>
